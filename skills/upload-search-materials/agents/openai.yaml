interface:
  display_name: "天猫搜推素材上传"
  short_description: "前端优先交接、可恢复搜推采集、素材审查与安全发布工作流"
  default_prompt: "Use $upload-search-materials to read the canonical Skill, open or resume the exact managed UI session, and provide its current link. The managed workbench starts a single-session background dispatcher that consumes persisted handoffs and bound requests through fixed processors; during healthy normal flow, do not call agent-wait, listen-handoff, wait-agent-request, stage processors, or terminal polling commands, and do not ask the user to type 已提交. Submission notifications and startup recovery scans cover both earlier and later submissions without chat or command approval prompts. Do not inspect source, scan Plugin or run directories, read raw handoff artifacts, or rediscover routes. Only after a fixed processor records a stable Agent diagnostic may you inspect the failing call path. Keep business decisions in the workbench and request host approval only for an unexpected path requiring new technical authority."
