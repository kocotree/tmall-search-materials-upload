interface:
  display_name: "天猫搜推素材上传"
  short_description: "前端优先交接、可恢复搜推采集、素材审查与安全发布工作流"
  default_prompt: "Use $upload-search-materials to read the canonical Skill and open the exact managed UI session. For every Agent-bound stage, call the backlog-first agent-wait action=listen at least once, even if the user already submitted; use 15-second segments, keep the same 30-second lease, and process only the returned handoff_status.handoff_identity through its declared fixed action. If the bounded wait ended, treat 已提交 only as an exact-session resume acknowledgement that returns the durable identity. Do this without chat or command approval prompts. During healthy normal flow, do not inspect source, scan Plugin or run directories, read raw handoff artifacts, or rediscover routes. Only after a fixed processor records a stable Agent diagnostic may you inspect the failing call path. Keep business decisions in the workbench and request host approval only for an unexpected path requiring new technical authority."
